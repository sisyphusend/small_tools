name: Publish

# 按包前缀打 tag 触发对应包的发布与 Release:
#   git tag bili-sub-v0.2.0  && git push origin bili-sub-v0.2.0
#   git tag xyz-text-v0.2.0  && git push origin xyz-text-v0.2.0
# tag 版本必须与对应包 package.json 的 version 一致（下方有校验）。
on:
  push:
    tags:
      - "bili-sub-v*"
      - "xyz-text-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 从 tag 解析包名
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            bili-sub-v*) echo "package=bili-sub" >> "$GITHUB_OUTPUT" ;;
            xyz-text-v*) echo "package=xyz-text" >> "$GITHUB_OUTPUT" ;;
            *) echo "未知 tag 前缀: $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - run: npm ci
      - run: npm run build -w ${{ steps.pkg.outputs.package }}
      - run: npm run typecheck -w ${{ steps.pkg.outputs.package }}

      - name: 校验 tag 与包版本一致
        run: |
          pkg="${{ steps.pkg.outputs.package }}"
          tag_ver="${GITHUB_REF_NAME#*-v}"
          pkg_ver="$(node -p "require('./' + pkg + '/package.json').version")"
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "tag 版本 $tag_ver 与 $pkg@$pkg_ver 不一致，请先更新 package.json"
            exit 1
          fi

      - name: npm pack
        run: npm pack -w ${{ steps.pkg.outputs.package }}

      - name: 发布到 npm
        run: npm publish ./${{ steps.pkg.outputs.package }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release 并附带 tgz
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.package }}-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
